<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Carros Clássicos à Venda — Coleção Curada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">

<body>

        <nav class="navbar">

                <li><a href="#">Início</a></li>
                <li><a href="#">Sobre</a></li>

                <li><a href="#">Contato</a></li>

        </nav>

    <section class="titulo-colecao">
        <span class="etiqueta-ano">ACERVO DESDE 1999</span>
        <h1>Acervo Particular de Clássicos</h1>
        <p>Modelos antigos adquiridos desde 1999, selecionados peça por peça e colocados à venda.</p>

    <script src="js/script.js"></script>

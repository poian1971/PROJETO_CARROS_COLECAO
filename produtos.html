    <!-- Container principal do Card -->
    <div class="card">

        <!-- Seção do Carrossel de Fotos -->
        <div class="carousel-container">

            <!-- Botão para voltar a foto anterior -->
            <button class="carousel-btn btn-prev" aria-label="Anterior">❮</button>

            <!-- Trilha onde as imagens ficam alinhadas lado a lado -->
            <div class="carousel-track">
                <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=600&q=80"
                    alt="Foto 1" class="carousel-image">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=600&q=80"
                    alt="Foto 2" class="carousel-image">
                <img src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?auto=format&fit=crop&w=600&q=80"
                    alt="Foto 3" class="carousel-image">
            </div>

            <!-- Botão para avançar para a próxima foto -->
            <button class="carousel-btn btn-next" aria-label="Próximo">❯</button>
        </div>

        <!-- Seção de Conteúdo (Texto) do Card -->
        <div class="card-content">
            <h2 class="card-title">Título do Imóvel ou Produto</h2>
            <p class="card-description">Exemplo estruturado com arquivos separados em HTML, CSS e JavaScript puro.</p>
        </div>
    </div>
